<h1>Génère une blague</h1>

<div class="conteneur">
  <button onclick="afficherBlague()">Nouvelle blague</button>
  <p id="setup"></p>
  <p id="punchline"></p>
</div>

<script>
  async function afficherBlague() {
    document.getElementById("setup").textContent = "Chargement...";
    document.getElementById("punchline").textContent = "";

    let reponse = await fetch("https://official-joke-api.appspot.com/random_joke");
    let blague = await reponse.json();

    document.getElementById("setup").textContent = blague.setup;
    document.getElementById("punchline").textContent = blague.punchline;
  }
</script>
