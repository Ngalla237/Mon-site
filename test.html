<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test Grid</title>
  <style>
    .boite-grid {
      display: grid;
grid-template-columns: 2fr 1fr;
      gap: 10px;
    }
    .item {
      background-color: #3498db;
      color: white;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="boite-grid">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
  <div class="item">4</div>
</div>

</body>
</html>
